[package]
name = "workflow-organizer"
version = "0.2.0"
edition = "2024"
description = "macOS-only CLI for opening registered Git projects and worktrees, and applying layered config overlays"
license = "MIT"
repository = "https://github.com/Myleshen/workflow-organizer"
homepage = "https://github.com/Myleshen/workflow-organizer"
readme = "README.md"
authors = ["Myleshen"]
keywords = ["git", "worktree", "projects", "launcher", "macos"]
categories = ["command-line-utilities"]

[[bin]]
name = "devx"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.6", features = ["derive"] }
clap_complete = "4.6.0"
dialoguer = "0.12.0"
fs2 = "0.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml = "0.9"
similar = "2.7.0"
toml = "1.1.0"

[dev-dependencies]
tempfile = "3.25.0"
