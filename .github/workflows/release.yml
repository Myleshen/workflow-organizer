name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Tag matches CARGO_PKG_VERSION
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c "import json,sys;print(json.load(sys.stdin)['packages'][0]['version'])")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "tag $tag does not match Cargo.toml version $version" >&2
            exit 1
          fi
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo test --locked
      - name: Build Apple Silicon binary
        run: |
          cargo build --release --locked
          strip -x target/release/devx
          version="${GITHUB_REF_NAME#v}"
          dir="dist/devx-${version}-macos-arm64"
          mkdir -p "$dir"
          cp target/release/devx "$dir/"
          cp LICENSE README.md "$dir/"
          if [ -f docs/devx.1 ]; then cp docs/devx.1 "$dir/"; fi
          tar -czf "dist/devx-${version}-macos-arm64.tar.gz" -C dist "devx-${version}-macos-arm64"
      - name: Add Intel target
        id: intel
        continue-on-error: true
        run: rustup target add x86_64-apple-darwin
      - name: Build Intel binary
        if: steps.intel.outcome == 'success'
        run: |
          cargo build --release --locked --target x86_64-apple-darwin
          strip -x target/x86_64-apple-darwin/release/devx
          version="${GITHUB_REF_NAME#v}"
          dir="dist/devx-${version}-macos-x86_64"
          mkdir -p "$dir"
          cp target/x86_64-apple-darwin/release/devx "$dir/"
          cp LICENSE README.md "$dir/"
          if [ -f docs/devx.1 ]; then cp docs/devx.1 "$dir/"; fi
          tar -czf "dist/devx-${version}-macos-x86_64.tar.gz" -C dist "devx-${version}-macos-x86_64"
      - name: Report skipped Intel build
        if: steps.intel.outcome != 'success'
        run: echo "Skipping the x86_64 build because rustup could not add x86_64-apple-darwin"
      - name: Checksums
        run: cd dist && shasum -a 256 *.tar.gz > SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS --generate-notes
