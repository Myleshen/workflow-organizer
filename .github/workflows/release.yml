name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Tag matches CARGO_PKG_VERSION
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c "import json,sys;print(json.load(sys.stdin)['packages'][0]['version'])")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "tag $tag does not match Cargo.toml version $version" >&2
            exit 1
          fi
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo test --locked
      - name: Add Intel target
        run: rustup target add x86_64-apple-darwin
      - name: Build and package both architectures
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            case "$target" in
              aarch64-apple-darwin) label=arm64 ;;
              x86_64-apple-darwin) label=x86_64 ;;
            esac
            cargo build --release --locked --target "$target"
            binary="target/$target/release/devx"
            if xcrun --find llvm-strip >/dev/null 2>&1; then
              xcrun llvm-strip -x "$binary"
            else
              strip -x "$binary"
            fi
            dir="dist/devx-${version}-macos-${label}"
            mkdir -p "$dir"
            cp "$binary" "$dir/"
            cp LICENSE README.md "$dir/"
            if [ -f docs/devx.1 ]; then cp docs/devx.1 "$dir/"; fi
            echo "packaging $dir/devx:"; lipo -archs "$dir/devx"
            tar -czf "dist/devx-${version}-macos-${label}.tar.gz" -C dist "devx-${version}-macos-${label}"
          done
      - name: Checksums
        run: cd dist && shasum -a 256 *.tar.gz > SHA256SUMS && cat SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS --generate-notes
